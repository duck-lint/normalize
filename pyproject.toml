[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "normalize"
version = "0.1.0"
description = "Layout-guided reconstruction of extracted book text"
requires-python = ">=3.12"
dependencies = [
  "PyMuPDF>=1.24",
  "Pillow>=10",
  "pytesseract>=0.3.10",
  "RapidFuzz>=3",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
normalize = "normalize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
