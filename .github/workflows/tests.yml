name: Whitespace workflow
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dictionary
        run: sudo apt-get update && sudo apt-get install -y libhunspell-1.7-0 hunspell-en-us
      - name: Validate five-step handoff
        run: |
          python tests/test_whitespace_workflow.py
          python -m unittest discover -s tests -v
