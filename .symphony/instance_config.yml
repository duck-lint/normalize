tracker:
  kind: github
  provider:
    repo: "duck-lint/normalize"
    token: $SYMPHONY_GITHUB_TOKEN
  required_labels:
    - symphony:auto
  active_states:
    - open
  terminal_states:
    - closed

polling:
  interval_ms: 5000

workspace:
  root: ~/code/symphony-workspaces/normalize
  repository: github.com/duck-lint/normalize
  branch: guh

human_response:
  authorized_user_ids:
    - 250741170

lifecycle:
  integrity_secret: "$SYMPHONY_LIFECYCLE_INTEGRITY_SECRET"

environment:
  capabilities:
    - id: normalize-python-dependencies
      command:
        executable: .venv/bin/python
        args:
          - -c
          - import fitz, PIL, pytesseract, rapidfuzz, numpy, cv2, pytest
    - id: normalize-cli
      command:
        executable: .venv/bin/normalize
        args:
          - check-env
    - id: tesseract
      command:
        executable: tesseract
        args:
          - --version
    - id: normalize-fixture-pdfs
      resources:
        - fixtures/einstein/Einstein, Albert - Relativity 10.pdf
        - fixtures/einstein/Einstein, Albert - Relativity 17.pdf
        - fixtures/einstein/Einstein, Albert - Relativity 23.pdf
        - fixtures/mccarthy/McCarthy, Cormac - Stella Maris.pt2 3.pdf
        - fixtures/mccarthy/McCarthy, Cormac - Stella Maris.pt2 6.pdf
        - fixtures/mccarthy/McCarthy, Cormac - Stella Maris.pt2 18.pdf

hooks:
  timeout_ms: 180000
  
  after_create: |
    set -eu

    git clone --depth 1 --single-branch \
      --branch guh \
      https://github.com/duck-lint/normalize.git .

    mkdir -p fixtures/einstein fixtures/mccarthy

    cp "/home/duck-lint/.local/share/normalize/Einstein/Einstein, Albert - Relativity 10.pdf" \
      "fixtures/einstein/"
    cp "/home/duck-lint/.local/share/normalize/Einstein/Einstein, Albert - Relativity 17.pdf" \
      "fixtures/einstein/"
    cp "/home/duck-lint/.local/share/normalize/Einstein/Einstein, Albert - Relativity 23.pdf" \
      "fixtures/einstein/"

    cp "/home/duck-lint/.local/share/normalize/McCarthy/McCarthy, Cormac - Stella Maris.pt2 3.pdf" \
      "fixtures/mccarthy/"
    cp "/home/duck-lint/.local/share/normalize/McCarthy/McCarthy, Cormac - Stella Maris.pt2 6.pdf" \
      "fixtures/mccarthy/"
    cp "/home/duck-lint/.local/share/normalize/McCarthy/McCarthy, Cormac - Stella Maris.pt2 18.pdf" \
      "fixtures/mccarthy/"

    python3 -m venv --copies .venv

    .venv/bin/python -m pip install \
      --no-index \
      --find-links "/home/duck-lint/.local/share/normalize/wheelhouse/linux-py312" \
      PyMuPDF Pillow pytesseract RapidFuzz NumPy opencv-python-headless pytest
    
    .venv/bin/python -m pip install \
      --no-index \
      --find-links "/home/duck-lint/.local/share/normalize/wheelhouse/linux-py312" \
      'setuptools>=68' 'wheel>=0.41'

    .venv/bin/python -m pip install \
      --no-index \
      --no-deps \
      --no-build-isolation \
      .

agent:
  max_concurrent_agents: 1

codex:
  command: codex --config 'model="gpt-6-luna"' --config 'model_reasoning_effort="high"' app-server
  approval_policy: on-request
  thread_sandbox: workspace-write
  turn_sandbox_policy:
    type: workspaceWrite
    networkAccess: false
